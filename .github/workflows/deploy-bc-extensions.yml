name: Deploy BC Extensions

on:
  repository_dispatch:
    types: [bc-environment-updated]
  workflow_dispatch:
    inputs:
      environment:
        description: "BC environment name (DEV, AMA, AMA HIST, Production)"
        required: true
        type: string

env:
  BC_TENANT_ID: "93e723e3-01e7-4e97-99cf-13ddd492ed98"
  BC_ENVIRONMENT: ${{ github.event.client_payload.environment || inputs.environment }}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Get BC access token
        id: token
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://login.microsoftonline.com/${{ env.BC_TENANT_ID }}/oauth2/v2.0/token" \
            -d "client_id=${{ secrets.BC_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.BC_CLIENT_SECRET }}" \
            -d "scope=https://api.businesscentral.dynamics.com/.default" \
            -d "grant_type=client_credentials")
          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Determine company ID for this environment
        id: company
        run: |
          if [ "${{ env.BC_ENVIRONMENT }}" == "Production" ]; then
            echo "companyId=e5fd0ac1-b3d3-ee11-904f-6045bdac9aed" >> "$GITHUB_OUTPUT"
          else
            echo "companyId=9b3d9592-1b7a-ef11-ac30-7c1e523f8000" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for any existing pending record to finish, then clear if still stuck
        run: |
          ENV_ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "${{ env.BC_ENVIRONMENT }}")
          for i in $(seq 1 20); do
            LIST=$(curl -s -X GET \
              "https://api.businesscentral.dynamics.com/v2.0/${{ env.BC_TENANT_ID }}/$ENV_ENCODED/api/microsoft/automation/v2.0/companies(${{ steps.company.outputs.companyId }})/extensionUpload" \
              -H "Authorization: Bearer ${{ steps.token.outputs.token }}")
            STALE_ID=$(echo "$LIST" | jq -r '.value[0].systemId // empty')
            if [ -z "$STALE_ID" ]; then
              echo "No pending record — clear to proceed."
              exit 0
            fi
            echo "Pending record $STALE_ID still present, waiting 15s... (attempt $i/20)"
            sleep 15
          done
          echo "Still stuck after 5 minutes — force-clearing with Bill of Lading's content."
          PATCH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
            "https://api.businesscentral.dynamics.com/v2.0/${{ env.BC_TENANT_ID }}/$ENV_ENCODED/api/microsoft/automation/v2.0/companies(${{ steps.company.outputs.companyId }})/extensionUpload($STALE_ID)/extensionContent" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            -H "Content-Type: application/octet-stream" \
            -H "If-Match: *" \
            -T "projBillofLading-main/Canyon Rim Consulting_projBillofLading_1.5.0.0.app")
          echo "PATCH status: $PATCH_STATUS"
          if [ "$PATCH_STATUS" != "204" ] && [ "$PATCH_STATUS" != "200" ]; then
            echo "::error::PATCH failed with status $PATCH_STATUS"
            exit 1
          fi
          INSTALL_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://api.businesscentral.dynamics.com/v2.0/${{ env.BC_TENANT_ID }}/$ENV_ENCODED/api/microsoft/automation/v2.0/companies(${{ steps.company.outputs.companyId }})/extensionUpload($STALE_ID)/Microsoft.NAV.upload" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            -d '')
          echo "Install status: $INSTALL_STATUS"

  deploy:
    needs: cleanup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: "Bill of Lading"
            appId: "7a5bb24a-7b5b-4b79-9987-5c7460c17d31"
            appPath: "projBillofLading-main/Canyon Rim Consulting_projBillofLading_1.5.0.0.app"
          - name: "DefaultLocation"
            appId: "87064380-af52-47ab-9167-c06796aef4b9"
            appPath: "DefaultLocation_Canyon Rim Consulting_1.5.0.1/Canyon Rim Consulting_DefaultLocation_1.5.0.2.app"
          - name: "Item Page Extension"
            appId: "7a5bb24a-7b5b-4b79-9987-5c7460c17d37"
            appPath: "Item Page Extension_Canyon Rim Consulting - Randy Nivert_1.5.0.0/Canyon Rim Consulting - Randy Nivert_Item Page Extension_1.5.0.0.app"
          - name: "Shelby Inventory Detail"
            appId: "a7e266bb-bff4-4cd5-8e52-981dcd5d888f"
            appPath: "Shelby Inventory Detail_Canyon Rim Consultiong_1.0.0.1 (1)/Canyon Rim Consultiong_Shelby Inventory Detail_1.0.0.0.app"
          - name: "Posted Sales Shipment Fields"
            appId: "4fd7b0ce-8dea-4aa6-9ec4-0855cd3bf1e8"
            appPath: "Posted Sales Shipment Fields_Canyon Rim Consulting - RN_1.0.0.0/Canyon Rim Consulting - RN_Posted Sales Shipment Fields_1.0.0.0.app"
          - name: "Shipto"
            appId: "72310100-4f74-49f4-bfe5-2d2c498005cc"
            appPath: "shipto_1_1.0.0.0/Canyon Rim Consulting_shipto_1.5.0.2.app"

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Get BC access token
        id: token
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://login.microsoftonline.com/${{ env.BC_TENANT_ID }}/oauth2/v2.0/token" \
            -d "client_id=${{ secrets.BC_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.BC_CLIENT_SECRET }}" \
            -d "scope=https://api.businesscentral.dynamics.com/.default" \
            -d "grant_type=client_credentials")
          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          if [ "$TOKEN" == "null" ] || [ -z "$TOKEN" ]; then
            echo "::error::Failed to get BC access token. Response: $RESPONSE"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Determine company ID for this environment
        id: company
        run: |
          if [ "${{ env.BC_ENVIRONMENT }}" == "Production" ]; then
            echo "companyId=e5fd0ac1-b3d3-ee11-904f-6045bdac9aed" >> "$GITHUB_OUTPUT"
          else
            echo "companyId=9b3d9592-1b7a-ef11-ac30-7c1e523f8000" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait until no pending record blocks this company
        run: |
          ENV_ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "${{ env.BC_ENVIRONMENT }}")
          for i in $(seq 1 30); do
            LIST=$(curl -s -X GET \
              "https://api.businesscentral.dynamics.com/v2.0/${{ env.BC_TENANT_ID }}/$ENV_ENCODED/api/microsoft/automation/v2.0/companies(${{ steps.company.outputs.companyId }})/extensionUpload" \
              -H "Authorization: Bearer ${{ steps.token.outputs.token }}")
            PENDING=$(echo "$LIST" | jq -r '.value[0].systemId // empty')
            if [ -z "$PENDING" ]; then
              echo "No pending record — safe to proceed."
              exit 0
            fi
            echo "Pending record $PENDING still present, waiting 15s... (attempt $i/30)"
            sleep 15
          done
          echo "::warning::Timed out after 7.5 minutes waiting for pending slot to clear."

      - name: Create extension upload record
        id: create
        run: |
          ENV_ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "${{ env.BC_ENVIRONMENT }}")
          RESPONSE=$(curl -s -X POST \
            "https://api.businesscentral.dynamics.com/v2.0/${{ env.BC_TENANT_ID }}/$ENV_ENCODED/api/microsoft/automation/v2.0/companies(${{ steps.company.outputs.companyId }})/extensionUpload" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d '{ "schedule": "Current version", "schemaSyncMode": "Add" }')
          SYSTEM_ID=$(echo "$RESPONSE" | jq -r '.systemId')
          if [ "$SYSTEM_ID" == "null" ] || [ -z "$SYSTEM_ID" ]; then
            echo "::error::Failed to create extension upload record for ${{ matrix.name }}. Response: $RESPONSE"
            exit 1
          fi
          echo "systemId=$SYSTEM_ID" >> "$GITHUB_OUTPUT"

      - name: Upload compiled .app content
        run: |
          ENV_ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "${{ env.BC_ENVIRONMENT }}")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
            "https://api.businesscentral.dynamics.com/v2.0/${{ env.BC_TENANT_ID }}/$ENV_ENCODED/api/microsoft/automation/v2.0/companies(${{ steps.company.outputs.companyId }})/extensionUpload(${{ steps.create.outputs.systemId }})/extensionContent" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            -H "Content-Type: application/octet-stream" \
            -H "If-Match: *" \
            -T "${{ matrix.appPath }}")
          echo "PATCH status: $STATUS"
          if [ "$STATUS" != "204" ] && [ "$STATUS" != "200" ]; then
            echo "::error::Upload failed with status $STATUS"
            exit 1
          fi

      - name: Trigger install
        run: |
          ENV_ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "${{ env.BC_ENVIRONMENT }}")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://api.businesscentral.dynamics.com/v2.0/${{ env.BC_TENANT_ID }}/$ENV_ENCODED/api/microsoft/automation/v2.0/companies(${{ steps.company.outputs.companyId }})/extensionUpload(${{ steps.create.outputs.systemId }})/Microsoft.NAV.upload" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            -d '')
          echo "Install trigger status: $STATUS"

      - name: Wait for install to actually finish
        run: |
          ENV_ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "${{ env.BC_ENVIRONMENT }}")
          for i in $(seq 1 30); do
            LIST=$(curl -s -X GET \
              "https://api.businesscentral.dynamics.com/v2.0/${{ env.BC_TENANT_ID }}/$ENV_ENCODED/api/microsoft/automation/v2.0/companies(${{ steps.company.outputs.companyId }})/extensionUpload" \
              -H "Authorization: Bearer ${{ steps.token.outputs.token }}")
            PENDING=$(echo "$LIST" | jq -r '.value[0].systemId // empty')
            if [ -z "$PENDING" ]; then
              echo "Install completed, slot is free."
              exit 0
            fi
            echo "Still pending ($PENDING), waiting 15s... (attempt $i/30)"
            sleep 15
          done
          echo "::warning::Timed out waiting for install to clear after 7.5 minutes."

  notify:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send confirmation email via Microsoft Graph
        run: |
          RESULT="${{ needs.deploy.result }}"
          RESPONSE=$(curl -s -X POST \
            "https://login.microsoftonline.com/${{ env.BC_TENANT_ID }}/oauth2/v2.0/token" \
            -d "client_id=${{ secrets.BC_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.BC_CLIENT_SECRET }}" \
            -d "scope=https://graph.microsoft.com/.default" \
            -d "grant_type=client_credentials")
          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')

          curl -s -X POST \
            "https://graph.microsoft.com/v1.0/users/${{ secrets.NOTIFY_SENDER_UPN }}/sendMail" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"message\": {
                \"subject\": \"BC Extension Deploy - ${{ env.BC_ENVIRONMENT }} - $RESULT\",
                \"body\": {
                  \"contentType\": \"Text\",
                  \"content\": \"Extension deployment to ${{ env.BC_ENVIRONMENT }} finished with status: $RESULT.\n\nSee the full run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
                },
                \"toRecipients\": [
                  { \"emailAddress\": { \"address\": \"${{ secrets.NOTIFY_RECIPIENT }}\" } }
                ]
              }
            }"
