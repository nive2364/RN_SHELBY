name: Deploy BC Extensions

# Triggered by Flow 1 (Power Automate) via repository_dispatch, or manually for testing.
on:
  repository_dispatch:
    types: [bc-environment-updated]
  workflow_dispatch:
    inputs:
      environment:
        description: "BC environment name (DEV, AMA, AMA HIST, Production)"
        required: true
        type: string

env:
  BC_TENANT_ID: "93e723e3-01e7-4e97-99cf-13ddd492ed98"
  # The environment name arrives differently depending on how the workflow was triggered.
  BC_ENVIRONMENT: ${{ github.event.client_payload.environment || inputs.environment }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one extension failing shouldn't cancel the others
      matrix:
        include:
          - name: "Bill of Lading"
            appId: "7a5bb24a-7b5b-4b79-9987-5c7460c17d31"
            appPath: "projBillofLading-main/Canyon Rim Consulting_projBillofLading_1.5.0.0.app"
          - name: "DefaultLocation"
            appId: "87064380-af52-47ab-9167-c06796aef4b9"
            appPath: "DefaultLocation_Canyon Rim Consulting_1.5.0.1/Canyon Rim Consulting_DefaultLocation_1.5.0.2.app"
          - name: "Item Page Extension"
            appId: "7a5bb24a-7b5b-4b79-9987-5c7460c17d37"
            appPath: "Item Page Extension_Canyon Rim Consulting - Randy Nivert_1.5.0.0/Canyon Rim Consulting - Randy Nivert_Item Page Extension_1.5.0.0.app"
          - name: "Shelby Inventory Detail"
            appId: "a7e266bb-bff4-4cd5-8e52-981dcd5d888f"
            appPath: "Shelby Inventory Detail_Canyon Rim Consultiong_1.0.0.1 (1)/Canyon Rim Consultiong_Shelby Inventory Detail_1.0.0.0.app"
          # To add a new extension later: add one more entry here with name / appId / appPath.

    steps:
      - name: Check out repo (so the .app files are available on disk)
        uses: actions/checkout@v4

      - name: Get BC access token (service principal / client credentials)
        id: token
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://login.microsoftonline.com/${{ env.BC_TENANT_ID }}/oauth2/v2.0/token" \
            -d "client_id=${{ secrets.BC_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.BC_CLIENT_SECRET }}" \
            -d "scope=https://api.businesscentral.dynamics.com/.default" \
            -d "grant_type=client_credentials")
          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          if [ "$TOKEN" == "null" ] || [ -z "$TOKEN" ]; then
            echo "::error::Failed to get BC access token. Response: $RESPONSE"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Determine company ID for this environment
        id: company
        run: |
          if [ "${{ env.BC_ENVIRONMENT }}" == "Production" ]; then
            echo "companyId=e5fd0ac1-b3d3-ee11-904f-6045bdac9aed" >> "$GITHUB_OUTPUT"
          else
            echo "companyId=9b3d9592-1b7a-ef11-ac30-7c1e523f8000" >> "$GITHUB_OUTPUT"
          fi

      - name: Create extension upload record
        id: create
        run: |
          ENV_ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "${{ env.BC_ENVIRONMENT }}")
          RESPONSE=$(curl -s -X POST \
            "https://api.businesscentral.dynamics.com/v2.0/${{ env.BC_TENANT_ID }}/$ENV_ENCODED/api/microsoft/automation/v2.0/companies(${{ steps.company.outputs.companyId }})/extensionUpload" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d '{ "schedule": "Current version", "schemaSyncMode": "Add" }')
          SYSTEM_ID=$(echo "$RESPONSE" | jq -r '.systemId')
          if [ "$SYSTEM_ID" == "null" ] || [ -z "$SYSTEM_ID" ]; then
            echo "::error::Failed to create extension upload record for ${{ matrix.name }}. Response: $RESPONSE"
            exit 1
          fi
          echo "systemId=$SYSTEM_ID" >> "$GITHUB_OUTPUT"

      - name: Upload compiled .app content (binary — this is the step Power Automate could not do)
        run: |
          ENV_ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "${{ env.BC_ENVIRONMENT }}")
          curl -s -X PATCH \
            "https://api.businesscentral.dynamics.com/v2.0/${{ env.BC_TENANT_ID }}/$ENV_ENCODED/api/microsoft/automation/v2.0/companies(${{ steps.company.outputs.companyId }})/extensionUpload(${{ steps.create.outputs.systemId }})/extensionContent" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            -H "Content-Type: application/octet-stream" \
            -H "If-Match: *" \
            --data-binary "@${{ matrix.appPath }}" \
            -w "\nHTTP status: %{http_code}\n"

      - name: Trigger install
        run: |
          ENV_ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "${{ env.BC_ENVIRONMENT }}")
          curl -s -X POST \
            "https://api.businesscentral.dynamics.com/v2.0/${{ env.BC_TENANT_ID }}/$ENV_ENCODED/api/microsoft/automation/v2.0/companies(${{ steps.company.outputs.companyId }})/extensionUpload(${{ steps.create.outputs.systemId }})/Microsoft.NAV.upload" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            -w "\nHTTP status: %{http_code}\n"

  notify:
    needs: deploy
    if: always() # send the email whether deploys succeeded or failed, so failures are visible too
    runs-on: ubuntu-latest
    steps:
      - name: Send confirmation email via Microsoft Graph
        run: |
          RESULT="${{ needs.deploy.result }}"
          RESPONSE=$(curl -s -X POST \
            "https://login.microsoftonline.com/${{ env.BC_TENANT_ID }}/oauth2/v2.0/token" \
            -d "client_id=${{ secrets.BC_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.BC_CLIENT_SECRET }}" \
            -d "scope=https://graph.microsoft.com/.default" \
            -d "grant_type=client_credentials")
          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')

          curl -s -X POST \
            "https://graph.microsoft.com/v1.0/users/${{ secrets.NOTIFY_SENDER_UPN }}/sendMail" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"message\": {
                \"subject\": \"BC Extension Deploy - ${{ env.BC_ENVIRONMENT }} - $RESULT\",
                \"body\": {
                  \"contentType\": \"Text\",
                  \"content\": \"Extension deployment to ${{ env.BC_ENVIRONMENT }} finished with status: $RESULT.\n\nSee the full run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
                },
                \"toRecipients\": [
                  { \"emailAddress\": { \"address\": \"${{ secrets.NOTIFY_RECIPIENT }}\" } }
                ]
              }
            }"
            
